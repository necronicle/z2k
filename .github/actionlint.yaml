# actionlint@v1.7.12 (версия, зафиксированная в ci.yml и ci_local.sh) не знает
# про ключ `queue` в `concurrency` — GitHub добавил его позже последнего
# релиза actionlint. Апстрим в курсе (rhysd/actionlint#654 PR, #657 issue),
# но ещё не выпущен. Без этого исключения actionlint честно, но ЛОЖНО красит
# publish.yml — сам GitHub `queue: max` принимает и исполняет штатно (живой
# эмпирический прогон 2026-08-10 на отдельной ветке-пробнике подтвердил: без
# queue: max ожидающий ран стабильно отменялся более новым пушем даже при
# cancel-in-progress: false; с queue: max — нет).
#
# Снять это исключение, когда actionlint выпустит поддержку queue (закрытие
# #657 или релиз, включающий #654) — тогда голая версия начнёт видеть
# ключ сама, а это исключение станет мёртвым и безвредным, но лучше убрать.
paths:
  .github/workflows/publish.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
