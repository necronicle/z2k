name: Release CDN (purge)

# z2k-enhanced — канал доставки: роутеры тянут файлы прямо с
# raw.githubusercontent.com (и зеркал) по имени ветки. Двигать эту ветку умеет
# только publish.yml и только после зелёного CI — то есть к моменту, когда
# отрабатывает этот workflow, релиз УЖЕ у людей. Здесь — вторая половина
# деплоя, пост-выкладочная:
#
# Один шаг: сбросить edge-кэш jsdelivr. Иначе фоллбэк-зеркало z2k_fetch
# отдаёт до 12 часов старья; purge.jsdelivr.net выселяет за ~1 сек.
#
# ПОЧЕМУ ЗДЕСЬ БОЛЬШЕ НЕТ ПРОВЕРКИ ОТДАЧИ (2026-08-12, решение Марка).
#
# Была вторая job, verify: она дожидалась, пока каждый изменённый файл реально
# отдаётся с правильным sha256, и краснела, если этого не происходило. Задумана
# против класса отказа «версия сдвинулась, а зеркало отдало старьё» (issue #26).
#
# На практике краснела она не от него. Гейтом доставки служит
# raw.githubusercontent, а красный статус давало ОТСТАВАНИЕ JSDELIVR — то есть
# фоллбэка, который к моменту проверки просто не успел прогреться и сам
# догоняет за часы. Доставка при этом исправна. Каждый релиз давал письмо о
# провале там, где ничего не сломано, и цена такого сигнала отрицательная:
# на красный перестают смотреть вообще, включая тот раз, когда он настоящий.
#
# Что мы при этом теряем, чтобы это было сказано вслух: автоматического
# сторожа над issue #26 больше нет. Если зеркало однажды и правда начнёт
# отдавать не те байты, узнаем мы об этом от людей, а не из ленты сборок.
#
# workflow_dispatch: 2026-08-06 p-73 ушёл в пуш в окно сбоя GitHub Actions —
# раны не создались вовсе, purge никто не сделал, и дёрнуть его вручную было
# нечем. Ручной запуск проходит по фоллбэк-пути (top-200 + полная карта).

on:
  push:
    branches:
      - z2k-enhanced
  workflow_dispatch:
  # Вызывается из publish.yml сразу после того, как релизная ветка переведена.
  # Своим ходом он бы там не завёлся: пуш, сделанный GITHUB_TOKEN, чужие
  # workflow не запускает. `ref` обязателен именно поэтому — на workflow_run
  # контекст указывает на ветку по умолчанию в состоянии ДО публикации, и без
  # явного коммита мы проверяли бы предыдущий релиз, отчитываясь за новый.
  workflow_call:
    inputs:
      ref:
        description: "Коммит, состояние которого проверяем на зеркалах"
        required: false
        type: string
      before:
        description: >-
          Вершина z2k-enhanced ДО перевода. Без неё разницу посчитать не из
          чего: на workflow_call полей github.event.before/after не существует,
          и шаг ниже уходил в фоллбэк «первые 200 файлов дерева» на КАЖДОМ
          релизе — то есть выселял tests/*, но не webpanel/* и не z2k.sh.
        required: false
        type: string

permissions:
  contents: read

# Два пуша подряд: старый ран НЕ гасим (его сброс кэша всё ещё осмыслен —
# файлы, не тронутые вторым пушем, тоже надо выселить), но и параллельно не
# дёргаем CDN двумя ранами — последовательно.
#
# queue: max — потому что одного `cancel-in-progress: false` для намерения
# выше НЕ ХВАТАЕТ: он сохраняет только УЖЕ ИДУЩИЙ ран, а в очереди группы у
# GitHub по умолчанию держится ровно ОДИН pending — следующий триггер молча
# отменяет и заменяет его. То есть «старый ран не гасим» работало, пока ранов
# два, и переставало ровно на третьем. Теряется при этом именно СБРОС КЭША:
# ветка к этому моменту уже сдвинута, релиз у людей, а зеркало продолжает
# отдавать старьё — ран не красный, его просто нет.
#
# Группа здесь общая на все три триггера не по недосмотру, а фактически:
# ветка по умолчанию репозитория — z2k-enhanced, поэтому и push в неё, и
# workflow_dispatch, и вызов из publish.yml дают один и тот же
# `cdn-refs/heads/z2k-enhanced`. Уникализировать группу по SHA, как сделано
# в ci.yml, здесь НЕЛЬЗЯ — последовательность в одной группе тут и есть цель
# (не поллить CDN двумя ранами разом), а не побочный эффект.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: cdn-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  purge:
    name: Evict jsdelivr edge cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Don't block CI; cache-purge failure is annoying, not fatal.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          # Need enough history to diff `before..after`. 0 = full history.
          # Repo is small, extra checkout time is negligible vs. the
          # robustness payoff when the push spans several commits.
          fetch-depth: 0

      - name: Compute changed files
        id: files
        env:
          # Вход workflow_call имеет ПРИОРИТЕТ над полем события.
          #
          # github.event.before/after существуют только на push. На единственном
          # боевом пути (publish.yml вызывает нас через workflow_call) их нет
          # вовсе — оба пусты, условие фоллбэка ниже истинно всегда, и каждый
          # релиз выселял «первые 200 файлов дерева» вместо изменённых. Первые
          # двести по алфавиту — это tests/*; webpanel/* и z2k.sh туда не
          # попадают. То есть кэш сбрасывался ровно там, где его никто не
          # читает, и не сбрасывался там, где читают.
          #
          # AFTER не нужен: у нас уже есть ref (он же HEAD чекаута), а на
          # workflow_call event.after пуст — сравниваем с HEAD.
          BEFORE: ${{ inputs.before || github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -eu
          mkdir -p /tmp/purge
          # AFTER пуст на workflow_call — тогда вторая точка это HEAD чекаута,
          # а он выставлен на inputs.ref, то есть ровно на публикуемый коммит.
          [ -n "${AFTER:-}" ] || AFTER=$(git rev-parse HEAD)
          # BEFORE может быть unreachable если push был force-push'ом amend'нутого
          # коммита: предыдущий tip SHA orphan'нулся, actions/checkout его не
          # fetch'нул. `git cat-file -e` проверяет наличие объекта в локальной
          # копии — fallback на top-200 strategy если коммита нет.
          # На workflow_dispatch BEFORE пуст — тот же фоллбэк.
          #
          # Фоллбэк теперь ДЕЙСТВИТЕЛЬНО крайний случай, а не обычный путь: на
          # публикации BEFORE приходит входом от publish.yml. Если он всё же
          # сработал на релизе — это сигнал, что связка publish→purge разошлась,
          # поэтому ниже об этом пишется предупреждением, а не рядовой строкой.
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              # New branch / force-push'ом amend'нутого / orphan before SHA:
              # before commit недоступен. Fall back to purging the whole
              # branch's top 200 files by name. Full-tree purge would rate-limit.
              echo "::warning::BEFORE='${BEFORE:-}' недоступен — выселяю первые 200 файлов дерева вместо изменённых. На публикации этого быть не должно: publish.yml передаёт before входом."
              git ls-tree -r --name-only HEAD | head -200 > /tmp/purge/files.txt
          else
              # `git diff --name-only before..after` covers every file
              # touched in the push regardless of how many commits it
              # contains.
              git diff --name-only "$BEFORE" "$AFTER" > /tmp/purge/files.txt
          fi
          # Корень доверия выселяем ВСЕГДА и целиком — обе половины.
          #
          # Манифест и его подпись это одна неделимая единица: пара, собранная
          # из свежей и протухшей половины, у роутера с защёлкнутым храповиком
          # означает не «подожду», а жёсткий отказ обновляться (инцидент
          # r-75.4, 2026-08-10). Подписи при этом не было ни в files_sha256, ни
          # в top-200-фоллбэке гарантированно, так что выселялась она только
          # если случайно попала в срез по имени. Ставим обе явно и первыми.
          for _tr in UPDATES.json UPDATES.json.sig; do
              if git cat-file -e "HEAD:$_tr" 2>/dev/null; then
                  printf '%s\n' "$_tr"
              fi
          done > /tmp/purge/trust.txt
          grep -vxE 'UPDATES\.json|UPDATES\.json\.sig' /tmp/purge/files.txt \
            >> /tmp/purge/trust.txt || true
          mv /tmp/purge/trust.txt /tmp/purge/files.txt
          count=$(wc -l < /tmp/purge/files.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "---Files to purge ($count)---"
          cat /tmp/purge/files.txt
          echo "---"

      - name: Fire purge requests
        if: steps.files.outputs.count != '0'
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          ok=0
          fail=0
          while IFS= read -r f; do
              [ -z "$f" ] && continue
              url="https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/${f}"
              code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$url" 2>/dev/null) || code="ERR"
              case "$code" in
                  2*) ok=$((ok + 1));  printf '  [%s] %s\n' "$code" "$f" ;;
                  *)  fail=$((fail + 1)); printf '  [%s] %s\n' "$code" "$f" ;;
              esac
          done < /tmp/purge/files.txt
          echo
          echo "purge summary: ok=$ok fail=$fail"
          # Even if every single URL returned 4xx/5xx (e.g. jsdelivr
          # rate-limit during a big push), the workflow itself should
          # not turn the commit red — `continue-on-error: true` above
          # already ensures that, this `exit 0` is just belt-and-braces.
          exit 0

