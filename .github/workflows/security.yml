name: Security

# Еженедельный секьюрити-скан + ручной запуск. Отдельно от CI намеренно:
# CI обязан быть детерминированным (тот же коммит — тот же вердикт), а эти
# проверки зависят от внешнего мира (базы уязвимостей, свежие правила) и
# могут покраснеть на коммите, который вчера был зелёным. Красный здесь —
# не «сломали сборку», а «появилась новая информация, посмотри».
#
# Контекст: репозиторий публичный, роутеры тянут с него обновления напрямую,
# а issue #28 содержит публичные обещания по безопасности канала доставки.

on:
  schedule:
    # Понедельник 06:17 UTC — вне пиков, минута не :00 чтобы не толкаться
    # в общеGitHub'овской толпе cron'ов.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  # Тот же тулчейн, которым собирается прод (ci.yml, Makefile). См. пояснение
  # у govulncheck ниже — «инструменту хватит stable» оказалось неверным.
  GO_VERSION: "1.25.13"

jobs:
  govulncheck:
    name: govulncheck (Go deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # ТОТ ЖЕ ТУЛЧЕЙН, ЧТО У ПРОДА, а не «stable».
          #
          # Здесь стояло go-version: stable с рассуждением «инструменту нужен
          # свежий go, уязвимости привязаны к версиям зависимостей, а не к
          # тулчейну раннера». Рассуждение верное ровно до тех пор, пока свежий
          # go вообще способен разобрать наш код. Go 1.27 удалил настройки
          # GODEBUG asynctimerchan, gotypesalias, tls3des и x509keypairleaf, а у
          # нас они прибиты директивами //go:debug в z2k-detect и z2k-verify —
          # прибиты сознательно, они держат форму ClientHello, по которой пробер
          # опознаёт DPI. Для 1.27 это не предупреждение, а ошибка разбора: скан
          # падал ДО анализа, то есть проверка уязвимостей не работала вовсе —
          # с 31.08 по 14.09.2026, три недели подряд, и красноту принимали за
          # «что-то там в security».
          #
          # Сканировать надо тем же тулчейном, которым собирается то, что уезжает
          # людям. Иначе мы проверяем не свой бинарник.
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan all Go modules
        run: |
          # Список перечисляется руками, и это подводило уже дважды: rt-proxy
          # месяцами жил вне CI, а z2k-verify не попал сюда при появлении —
          # прямо под комментарием «все четыре модуля, а не те, что вспомнили».
          # Пока источник матрицы не един, здесь обязаны быть ВСЕ модули с go.mod
          # (сторожит tests/test_module_matrix.sh).
          rc=0
          for m in mtproxy-client rt-proxy vps-relay z2k-detect z2k-verify z2k-warpd; do
            echo "=== govulncheck: $m ==="
            (cd "$m" && govulncheck ./...) || rc=1
          done
          exit $rc

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF в Code scanning
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Аудит самих workflows: незапиненные экшены, инжекции через ${{ }},
      # утечки credentials из checkout, избыточные permissions. Workflows —
      # код с доступом к каналу доставки на роутеры, ревьюится как код.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Полная история: секрет, закоммиченный и «удалённый» следующим
          # коммитом, в публичном репо всё равно утёк — и должен быть найден.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Версия прибита ЯВНО, хотя совпадает с умолчанием action. Синтаксис
          # исключений в .gitleaks.toml зависит от неё ([allowlist] до 8.25,
          # [[allowlists]] после), и тихий переезд умолчания при бампе action
          # сделал бы конфиг нечитаемым — скан снова утонул бы в шуме.
          GITLEAKS_VERSION: "8.24.3"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            # manual, а НЕ none. Здесь стояло none («сканировать без сборки»),
            # но Go этот режим не поддерживает вовсе: init падал с «Go does not
            # support the none build mode. Please try using one of the
            # following build modes instead: autobuild, manual», и анализ Go не
            # проходил ни разу с середины августа 2026 — красный крестик в
            # еженедельном прогоне, а в Code scanning ни одной находки по Go.
            # Модулей шесть в подкаталогах, поэтому собираем их сами тем же
            # циклом, что у govulncheck, а не надеемся на autobuild.
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL тянет свой go, и по той же причине, что у govulncheck выше,
      # новый тулчейн спотыкается о наши //go:debug. Ставим нужную версию до
      # init: он подхватывает go из PATH.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          # Тот же список, что у govulncheck: все каталоги с go.mod
          # (сторожит tests/test_module_matrix.sh).
          rc=0
          for m in mtproxy-client rt-proxy vps-relay z2k-detect z2k-verify z2k-warpd; do
            echo "=== go build: $m ==="
            (cd "$m" && go build ./...) || rc=1
          done
          exit $rc

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
