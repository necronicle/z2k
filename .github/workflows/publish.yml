name: Publish (move release branch)

# ЧТО ЭТО ТАКОЕ.
#
# Единственное место, которое имеет право двигать `z2k-enhanced` — ветку, с
# которой роутеры тянут всё: манифест, файлы патча, `z2k.sh` для переустановки,
# и с которой ставится однострочник из README. Что попало в эту ветку — то у
# людей, немедленно, независимо от `current`.
#
# ЗАЧЕМ. До 2026-08-09 в релизную ветку пушил человек, а CI прогонялся уже
# после — то есть код доезжал до людей раньше собственных тестов. Гейт был, но
# жил внутри `scripts/release.sh`: скрипт сам ждал `gh run` и умел пропускать
# ожидание переменной. Гейт, который можно переждать или обойти, при одном
# разработчике рано или поздно обходится.
#
# Теперь порядок обратный и обойти его нечем: человек пушит только в
# `z2k-staging`, а верхушку релизной ветки переставляет этот workflow — и только
# после зелёного CI ровно на этом коммите. Не прошло — ветка не сдвинулась, и
# люди ничего не увидели. Так публикуют MikroTik (строка в `NEWESTa7.stable`),
# OpenWrt (`stable_version` в `.versions.json`), Home Assistant (`stable.json`):
# код лежит доступным заранее, публикация — это движение указателя. У нас роль
# указателя играет сама ссылка ветки.
#
# ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ. Ключа подписи. Робот переносит ссылку на уже
# подписанный коммит и обязан ПРОВЕРИТЬ подпись, но собрать релиз он не может.
# Модель угроз — «захватили репозиторий»: ключ, лежащий в secrets, захватывается
# вместе с ним. Компрометация Actions даёт отказ в публикации, но не подделку.
#
# ГРАБЛИ, КОТОРЫЕ УЧТЕНЫ.
#   * `workflow_run` берёт этот файл С ВЕТКИ ПО УМОЛЧАНИЮ, а не со staging.
#     Это и хорошо (правка публикатора в staging не может сама себя выпустить),
#     и требует помнить: изменения здесь вступают в силу со следующего релиза.
#     Поэтому же самый первый переход на эту схему делается руками — иначе
#     публиковать пока некому.
#   * Пуш, сделанный GITHUB_TOKEN, НЕ запускает другие workflow. Значит
#     `jsdelivr-purge.yml` после нашего пуша сам не заведётся, и сброс кэша
#     пришлось бы потерять. Поэтому он вызывается отсюда явно, как переиспользуемый.

on:
  # zizmor: ignore[dangerous-triggers] проверено ниже, конкретного риска нет
  #
  # zizmor помечает workflow_run как опасный триггер, и в общем случае
  # справедливо: он идёт в привилегированном контексте, и workflow, который
  # ВЫПОЛНИТ содержимое кандидата, отдаёт репозиторий кому угодно. У нас этого
  # нет, проверено построчно:
  #   * job `gate` имеет `contents: read` + `actions: read`, записи нет;
  #   * её чекаут без `ref:` — берётся ветка по умолчанию, а не коммит
  #     кандидата; из дерева кандидата НИЧЕГО не исполняется, только
  #     git-команды над объектами и запрос к API;
  #   * job `publish` вообще не выкачивает дерево (см. комментарий там);
  #   * публикация требует тег, подписанный ключом, которого в GitHub нет.
  # Худшее, что даёт посторонний: PR из форка с веткой, названной
  # `z2k-staging`, запустит этот workflow (фильтр ниже сверяется с именем
  # ветки-источника) — и умрёт на проверке подписи. Цена — впустую
  # потраченный ран.
  #
  # Подавляем осознанно, чтобы красное не тлело годами и чтобы следующий
  # человек не начал «чинить» рабочую схему. Если структура изменится —
  # особенно если здесь появится чекаут кандидата или исполнение чего-либо из
  # его дерева — подавление обязано быть снято вместе с этим комментарием.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [z2k-staging]
  # Ручка на случай, если ран CI не создался вовсе (прецедент 2026-08-06: сбой
  # Actions, раны не появились, дёрнуть было нечего).
  workflow_dispatch:
    inputs:
      sha:
        description: "Коммит z2k-staging для публикации (пусто = верхушка)"
        required: false
        type: string

permissions:
  contents: read

# Публикация — это движение одной ссылки. Две одновременно не нужны никогда,
# но это НЕ значит, что лишние можно ронять: `cancel-in-progress: false` без
# `queue: max` защищает только от одновременного бега (in-progress), а не от
# самого GitHub. По умолчанию в очереди группы держится РОВНО один pending-ран
# — следующий триггер молча отменяет и заменяет его, независимо от
# cancel-in-progress. Живой сценарий: ран публикации A ждёт очереди, пока
# работает более ранний ран той же группы; в это время staging получает ещё
# один зелёный CI (обычный коммит B, publish=no) — его publish-ран становится
# новым pending и БЕЗ ПРЕДУПРЕЖДЕНИЯ отменяет ожидающий ран A. Подписанный тег
# A остаётся неопубликованным, и это не самоисправляется следующим релизом —
# та же гонка повторится для него. Эмпирически воспроизведено и проверено на
# отдельной ветке-пробнике 2026-08-10: с `queue: max` все три рана в той же
# последовательности (в работе / в очереди / новый триггер) выполнились по
# очереди без единой отмены; без него — pending-ран стабильно отменялся.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    name: Проверить, можно ли это публиковать
    # Красный CI до решения не доходит вовсе.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions:read — только для workflow_dispatch-ветки: gh api спрашивает
    # список ранов CI по head_sha, чтобы не публиковать вручную коммит без
    # зелёного прогона. contents:read (уровень workflow) уже есть, этого
    # достаточно для checkout; write нигде в этой job не нужен.
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      sha: ${{ steps.decide.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Решить
        id: decide
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          STAGING: z2k-staging
          RELEASE: z2k-enhanced
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          git fetch -q origin "$STAGING" "$RELEASE"

          CAND="${RUN_SHA:-}"
          [ -n "${INPUT_SHA:-}" ] && CAND="$INPUT_SHA"
          [ -n "$CAND" ] || CAND=$(git rev-parse "origin/$STAGING")
          CAND=$(git rev-parse "$CAND")

          # 0. workflow_dispatch — ручка на случай, если ран CI не создался
          #    вовсе (см. шапку файла). Условие job'ы наверху пускает
          #    workflow_dispatch БЕЗ проверки вердикта — github.event.workflow_run
          #    у ручного запуска попросту не приходит, взять его неоткуда. Значит
          #    без явной проверки здесь кто угодно с правом ручного запуска мог
          #    опубликовать SHA, для которого CI провалился или не бежал вообще.
          #    Спрашиваем Actions API про ИМЕННО этот коммит, а не доверяем факту,
          #    что нас вызвали руками.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # По `path`, не по `name`: display name ("CI") — вольный текст из
            # `name:` в самом workflow-файле, кто угодно с правом править
            # .github/workflows/*.yml может его переименовать (случайно или
            # нет), и матч по имени тогда перестанет находить что-либо вообще.
            # `path` — файл в дереве репозитория, тот самый идентификатор,
            # который отличает CI от любого другого workflow с тем же именем.
            _ci_ok=$(gh api "repos/${REPO}/actions/runs?head_sha=${CAND}&status=completed&per_page=50" \
                       --jq '[.workflow_runs[] | select(.path==".github/workflows/ci.yml" and .conclusion=="success")] | length' \
                       2>/dev/null) || _ci_ok=0
            case "$_ci_ok" in ''|*[!0-9]*) _ci_ok=0 ;; esac
            if [ "$_ci_ok" -lt 1 ]; then
              echo "::error::ручной запуск, но у коммита $CAND нет ни одного зелёного прогона CI — проверять нечего"
              exit 1
            fi
            echo "ручной запуск: у $CAND есть зелёный CI ($_ci_ok шт.)"
          fi

          # (Раньше здесь стоял tip-check: "публикуем, только если CAND — это
          # ровно текущая верхушка staging". Убран — он противоречил
          # собственной формальной модели ("кандидат — это подписанный тег,
          # не tip staging") в двух конкретных местах разом: с ним застревал
          # НАВСЕГДА уже подписанный, полностью валидный тег A, если после
          # него на staging попадал ЛЮБОЙ обычный коммит B без своего релиза —
          # gate для A видел tip=B≠A и отказывался публиковать НАВСЕГДА (а не
          # "подождать своего рана" — своего рана у A и не было, вызывать его
          # некому, следующий релиз просто перепрыгнул бы через A). Ручной
          # workflow_dispatch с sha=A эту дыру не закрывал: та же самая
          # проверка стояла безусловно, до ветвления на event_name.
          #
          # Защита от публикации УЖЕ УСТАРЕВШЕГО кандидата (ради чего tip-check
          # изначально и заводился) никуда не делась — она ниже, в проверке
          # seq: если тем временем УЖЕ опубликован более новый релиз C, то
          # seq(A) <= seq(published=C) и шаг "4" откажет по существу дела
          # ("seq не вырос"), а не по совпадению с сиюминутным состоянием
          # ветки. Это тот же результат, что и tip-check пытался дать, только
          # без anti-паттерна "любой левый коммит на staging блокирует чужой,
          # никак с ним не связанный релиз".

          # 2. Только вперёд. Отказ здесь означает, что релизная ветка ушла
          #    куда-то помимо staging — это авария, а не штатный путь.
          if ! git merge-base --is-ancestor "origin/$RELEASE" "$CAND"; then
            echo "::error::$RELEASE не является предком кандидата — расхождение веток, публикация невозможна"
            exit 1
          fi

          # 3. Сдвинулся ли `current`. Не сдвинулся — это был пуш кода, и он
          #    людям не предназначен. Молча выходим: это штатное большинство
          #    пушей, а не ошибка.
          _cur() { git show "$1:UPDATES.json" | sed -n 's/.*"current"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
          _seq() { git show "$1:UPDATES.json" | sed -n 's/.*"seq"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -1; }
          NEW_CUR=$(_cur "$CAND"); OLD_CUR=$(_cur "origin/$RELEASE")
          [ -n "$NEW_CUR" ] || { echo "::error::не читается current у кандидата"; exit 1; }
          if [ "$NEW_CUR" = "$OLD_CUR" ]; then
            echo "::notice::current не сдвинут ($OLD_CUR) — это пуш кода, публиковать нечего"
            echo "publish=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 4. seq строго растёт. Роутер использует его как антидаунгрейд;
          #    объявление с непродвинутым seq будет отвергнуто у людей — то
          #    есть «выпустили и не доехало», худший из отказов.
          NEW_SEQ=$(_seq "$CAND"); OLD_SEQ=$(_seq "origin/$RELEASE")
          [ -n "$NEW_SEQ" ] || { echo "::error::не читается seq у кандидата"; exit 1; }
          if [ -n "$OLD_SEQ" ] && [ "$NEW_SEQ" -le "$OLD_SEQ" ]; then
            echo "::error::seq не вырос: опубликовано $OLD_SEQ, у кандидата $NEW_SEQ"
            exit 1
          fi

          # 4а. Целостность history независимо от того, кто и как собрал
          #     манифест. release.sh и так гарантирует это по построению
          #     (дописывает одну строку текстом, не трогая остальные — см.
          #     scripts/release.sh), но gate не должен верить чужому процессу:
          #     ручная правка, кривой мердж или скомпрометированный release.sh
          #     на чьей-то машине способны нарушить ровно это, а seq/подпись/тег
          #     сами по себе такую порчу не ловят (seq может честно вырасти на
          #     переписанной истории, подпись накроет что угодно, что ей дали
          #     подписать). Проверяем: старые записи — неизменный префикс, у
          #     кандидата ровно одна новая запись сверх них, current — это её "v".
          python3 - "$CAND" "$RELEASE" <<'PYEOF'
          import json, subprocess, sys
          cand, release = sys.argv[1], sys.argv[2]

          def read(ref):
              raw = subprocess.run(["git", "show", f"{ref}:UPDATES.json"],
                                    capture_output=True, text=True, check=True).stdout
              return json.loads(raw)

          old = read(f"origin/{release}")
          new = read(cand)
          oh, nh = old["history"], new["history"]

          if nh[:len(oh)] != oh:
              print("::error::history не является продолжением опубликованной — префикс изменён или переставлен")
              sys.exit(1)
          if len(nh) != len(oh) + 1:
              print(f"::error::кандидат добавляет {len(nh) - len(oh)} записей в history вместо ровно одной")
              sys.exit(1)
          if new["current"] != nh[-1]["v"]:
              print(f"::error::current='{new['current']}' не совпадает с последней записью history ('{nh[-1]['v']}')")
              sys.exit(1)

          # Форма проверена (префикс/count/current==v), теперь СОДЕРЖАНИЕ новой
          # записи. Без этого версия могла бы повториться (роутер с
          # installed_tag==current трактует это как "уже стоит" и не обновится
          # — см. lib/auto_update.sh), а неполная запись (например, без
          # changed_files) доехала бы до истории без единого доставляемого файла.
          entry = nh[-1]
          required = {"v": str, "type": str, "ts": str, "ref": str, "desc": str, "changed_files": list}
          for key, typ in required.items():
              if key not in entry:
                  print(f"::error::новая запись history без обязательного поля '{key}'")
                  sys.exit(1)
              if not isinstance(entry[key], typ):
                  print(f"::error::поле '{key}' новой записи history не {typ.__name__}")
                  sys.exit(1)
          if entry["type"] not in ("patch", "reinstall"):
              print(f"::error::type='{entry['type']}' — должен быть patch или reinstall")
              sys.exit(1)
          if not entry["changed_files"]:
              print("::error::changed_files пуст — релиз без единого доставляемого файла")
              sys.exit(1)
          versions_seen = [h["v"] for h in oh]
          if entry["v"] in versions_seen:
              print(f"::error::версия '{entry['v']}' уже встречалась в history — номер релиза нельзя переиспользовать")
              sys.exit(1)
          print(f"history цела: {len(oh)} -> {len(nh)} записей, current == history[-1].v, схема и уникальность версии в порядке")
          PYEOF

          # 5. Подпись. Проверяем ИМЕННО ТЕМ ключом, который лежит у людей
          #    сейчас (в опубликованной ветке), а не тем, что приехал вместе с
          #    кандидатом: иначе кандидат мог бы принести свой ключ и сам себя
          #    заверить. Замена ключа — отдельный ручной путь с подтверждением
          #    отпечатка (см. z2k_guard_key_swap в lib/install.sh).
          mkdir -p /tmp/pub
          git show "$CAND:UPDATES.json"     > /tmp/pub/m.json
          if ! git cat-file -e "$CAND:UPDATES.json.sig" 2>/dev/null; then
            echo "::error::у кандидата нет UPDATES.json.sig — неподписанный релиз отвергнет каждый роутер, уже принимавший подписанные"
            exit 1
          fi
          git show "$CAND:UPDATES.json.sig" > /tmp/pub/m.sig
          git show "origin/$RELEASE:files/etc/z2k-update-pub.pem" > /tmp/pub/pub.pem

          # «Подпись не сходится» и «проверить нечем» — разные диагнозы, а
          # выглядят одинаково: оба останавливают релиз. Ed25519 требует
          # `-rawin`, которого нет в LibreSSL и в OpenSSL 1.1.1. На раннере
          # стоит OpenSSL 3, но если это когда-нибудь изменится, отказ должен
          # называть настоящую причину, а не обвинять подпись.
          if ! openssl pkeyutl -help 2>&1 | grep -q -- '-rawin'; then
            echo "::error::$(openssl version) не умеет Ed25519 (-rawin) — проверить подпись нечем, публикация остановлена"
            exit 1
          fi

          if ! openssl pkeyutl -verify -rawin -pubin -inkey /tmp/pub/pub.pem \
                 -in /tmp/pub/m.json -sigfile /tmp/pub/m.sig >/dev/null 2>&1; then
            echo "::error::подпись манифеста не сходится с опубликованным ключом — публикация остановлена"
            exit 1
          fi

          # 6. Тег: неизменяемое имя релиза И адрес, по которому роутер качает
          #    файлы (ref в манифесте равен имени тега). Инварианты: имя ==
          #    current == ref, цель == этот коммит, подпись тем же ключом.
          git fetch -q --tags origin || true
          if ! git rev-parse -q --verify "refs/tags/$NEW_CUR" >/dev/null; then
            echo "::error::нет тега $NEW_CUR — релиз без неизменяемой ссылки публиковать нельзя"
            exit 1
          fi
          _tgt=$(git rev-list -n 1 "refs/tags/$NEW_CUR")
          if [ "$_tgt" != "$CAND" ]; then
            echo "::error::тег $NEW_CUR указывает на $_tgt, а публикуется $CAND"
            exit 1
          fi
          _ref=$(grep '^[[:space:]]*{"v":' /tmp/pub/m.json \
                 | sed -n "s/.*\"v\"[[:space:]]*:[[:space:]]*\"${NEW_CUR}\".*\"ref\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -1)
          if [ "$_ref" != "$NEW_CUR" ]; then
            echo "::error::ref в манифесте = '$_ref', а тег '$NEW_CUR' — роутер пошёл бы не туда"
            exit 1
          fi

          # Строку allowed-signers собираем из опубликованного PEM честно:
          # длины полей в формате явные, и «почти правильная» строка молча не
          # подошла бы к подписи.
          python3 - <<'PYEOF' > /tmp/pub/allowed
          import base64, struct, subprocess
          der = subprocess.run(["openssl", "pkey", "-pubin", "-in", "/tmp/pub/pub.pem",
                                "-outform", "DER"], capture_output=True, check=True).stdout
          def s(b):
              return struct.pack(">I", len(b)) + b
          blob = s(b"ssh-ed25519") + s(der[-32:])
          print("z2k-release ssh-ed25519 " + base64.b64encode(blob).decode())
          PYEOF
          # Судим ПО КОДУ ВОЗВРАТА, а не по тексту.
          #
          # `git verify-tag` печатает «Good "git" signature with ED25519 key ...»
          # для ЛЮБОЙ математически корректной подписи, и лишь отдельной строкой
          # «No principal matched.» сообщает, что ключ не наш. Проверка текстом
          # по слову «Good» пропускает тег, подписанный чужим ключом — измерено:
          # чужой ключ даёт код 1, но строку «Good» печатает.
          if git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=/tmp/pub/allowed \
               verify-tag "$NEW_CUR" >/dev/null 2>&1; then
            echo "подпись тега $NEW_CUR сходится с опубликованным ключом"
          else
            echo "::error::подпись тега $NEW_CUR не сходится с опубликованным ключом"
            git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=/tmp/pub/allowed \
                verify-tag "$NEW_CUR" 2>&1 | head -5
            exit 1
          fi

          echo "публикуем $NEW_CUR ($CAND), seq $OLD_SEQ -> $NEW_SEQ, подпись сошлась"
          {
            echo "publish=yes"
            echo "sha=$CAND"
            echo "version=$NEW_CUR"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Перевести релизную ветку
    needs: gate
    if: needs.gate.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Единственное место во всём репозитории, которому нужна запись.
    permissions:
      contents: write
    outputs:
      moved: ${{ steps.push.outputs.moved }}
      # Вершина z2k-enhanced ДО перевода — вход для сброса кэша CDN.
      before: ${{ steps.push.outputs.before }}
    steps:
      # Чекаута здесь НЕТ, и это не упущение.
      #
      # Раньше рабочее дерево выкачивалось только ради `git push`, а вместе с
      # ним actions/checkout оставлял токен в .git/config на всё время job
      # (persist-credentials по умолчанию true) — это и ловил zizmor
      # (artipacked). Документированного способа пушить с
      # persist-credentials: false в README actions/checkout нет, поэтому
      # вместо самодельного обходного пути берём штатный API.
      #
      # Публикация — это перевод ОДНОЙ ссылки на уже существующий в репозитории
      # коммит. Дерево для этого не нужно ни на байт.
      - name: Перевести ссылку релизной ветки
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
          VER: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          # Прежняя вершина ветки — ЗАПОМИНАЕМ ДО ПЕРЕВОДА.
          #
          # Она нужна не здесь, а дальше, в сбросе кэша CDN: без неё purge не
          # знает, какие файлы изменил релиз, и уходит в фоллбэк «первые 200
          # файлов дерева». В этих двухстах по алфавиту лежат tests/*, а
          # webpanel/* и сам z2k.sh не лежат — то есть выселялось всё, кроме
          # того, что менялось. Проверено на реальном прогоне r-75.17: список
          # обрывается на tests/test_panel_auth.sh.
          #
          # Раньше purge пытался взять эти точки из github.event.before/after.
          # На единственном боевом пути их не существует: publish вызывает
          # purge через workflow_call, а не пушем, и полей before/after в
          # унаследованном контексте нет. Условие фоллбэка было истинно ВСЕГДА.
          #
          # Отказ чтения не роняет публикацию: пустой BEFORE вернёт purge к
          # прежнему поведению, а не остановит релиз.
          BEFORE=$(gh api "repos/${REPO}/git/refs/heads/z2k-enhanced" \
                     --jq .object.sha 2>/dev/null || echo "")
          echo "before=${BEFORE}" >> "$GITHUB_OUTPUT"

          # Никакого повторного tip-check здесь больше нет (был, убран — см.
          # комментарий в gate про формальную модель "кандидат = подписанный
          # тег"). "$SHA" уже прошёл gate целиком: подпись, тег, история, seq
          # строго больше опубликованного. Публиковать его корректно прямо
          # сейчас, независимо от того, что происходит на staging параллельно.
          #
          # force НЕ передаём — и это ровно та же гарантия, что была у
          # `git push` без --force. Документация REST API про этот параметр:
          # «Indicates whether to force the update or to make sure the update
          # is a fast-forward update. Leaving this out or setting it to false
          # will make sure you're not overwriting work.»
          # https://docs.github.com/en/rest/git/refs
          #
          # Единственный случай, когда шаг может не пройти, — если МЕЖДУ
          # решением gate и этим моментом кто-то ДРУГОЙ уже опубликовал более
          # новый релиз (concurrency-группа сериализует раны ЭТОГО workflow, а
          # не защищает от стороннего актора с правом записи). Тогда мы честно
          # краснеем, а не "тихо пропускаем" — это не рутина, которую стоит
          # проглатывать молча.
          if ! gh api -X PATCH "repos/${REPO}/git/refs/heads/z2k-enhanced" \
                 -f "sha=${SHA}" >/dev/null; then
            echo "::error::перевод z2k-enhanced на $SHA не прошёл — ветка ушла вперёд помимо этого пайплайна (API отказал: не перемотка вперёд)"
            echo "moved=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "moved=yes" >> "$GITHUB_OUTPUT"
          echo "::notice::опубликовано: $VER ($SHA)"

  cdn:
    name: CDN
    needs: [gate, publish]
    # Мало того что gate решил "publish=yes" — ветка ДЕЙСТВИТЕЛЬНО должна была
    # сдвинуться. Раньше publish, обнаружив устаревший кандидат, делал
    # `exit 0` (успех, ничего не сломано) БЕЗ этого сигнала — cdn всё равно
    # запускался и honestly пытался проверить релиз, который никто никуда не
    # передвигал: сравнение с тем, что реально на ветке (осталось старым),
    # било бы job'у красным по причине, которая не имеет отношения к CDN —
    # это выглядело бы как инцидент там, где просто ничего не произошло.
    if: needs.gate.outputs.publish == 'yes' && needs.publish.outputs.moved == 'yes'
    # Вызываем явно: пуш, сделанный GITHUB_TOKEN, чужие workflow не запускает,
    # поэтому сам по себе jsdelivr-purge.yml после публикации не заведётся.
    uses: ./.github/workflows/jsdelivr-purge.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      # Обе точки, а не только новая: без before purge не может посчитать
      # разницу и выселяет не те файлы. См. пояснение в шаге push выше.
      before: ${{ needs.publish.outputs.before }}
