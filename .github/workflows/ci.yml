name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Ручной запуск. 2026-08-06 релиз p-73 был запушен ровно в окно сбоя GitHub
  # Actions: ни одного рана не создалось вовсе — и перезапустить было НЕЧЕГО,
  # у workflow не было ручки. Релиз уехал юзерам без единого прогона CI и
  # валидировался вручную постфактум. workflow_dispatch — та самая ручка.
  workflow_dispatch:

# GITHUB_TOKEN по умолчанию умеет писать в репозиторий. Ни одной джобе здесь
# запись не нужна, а z2k-enhanced — это ветка, с которой роутеры тянут
# обновления напрямую: скомпрометированный шаг с пишущим токеном равен захвату
# канала доставки. Least privilege, расширять точечно на уровне джобы.
permissions:
  contents: read

# Наслоившиеся раны на одной ветке гасятся новыми — КРОМЕ z2k-enhanced: пуш
# туда — это выкладка байтов (новые установки видят их сразу), а вердикт CI на
# нём — вход CD-гейта в scripts/release.sh: без вердикта не собирается
# объявление версии флоту. Отменённый ран = релиз, который нельзя объявить.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/z2k-enhanced' }}

env:
  # Продовый тулчейн. Бинарники для роутеров собираются ИМЕННО этой версией —
  # раньше тут стоял "stable", и CI годами доказывал, что код компилируется
  # тулчейном, которым никто ничего не шипит. Проверять надо то, что едет юзерам.
  #
  # Почему НЕ 1.26.x: golang/go#77730 — рантайм считает _ENOSYS равным 38, как на
  # x86, тогда как на MIPS это 89. Ошибка futex_time64 распознаётся неверно, и на
  # ядрах без него (наши Keenetic) падает всё, что ждёт на таймере. Починено в
  # 1.26.2, но проверить это на реальном MIPS нам не на чем.
  #
  # Почему НЕ остаёмся на 1.22.12: она снята с поддержки, правки безопасности в
  # неё не идут. 1.25.12 — последняя версия, в рантайме которой futex_time64 нет
  # ни одной строкой, то есть #77730 в ней невыразим в принципе; заодно закрыт
  # #71591 (дедлоки планировщика на MIPS, чинились в 1.23.8/1.24.2/1.25.0).
  #
  # Ранняя формулировка «1.26.x ломает MIPS soft-float» неверна и убрана: сама
  # soft-float арифметика во всех трёх тулчейнах даёт побайтово одинаковый
  # результат, дело было в рантайме, а не в кодогенерации.
  GO_VERSION: "1.25.12"

jobs:
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # инструменту прод-паритет не нужен
          cache: false

      - name: Install actionlint
        # go install проверяет модуль по sum DB — пиннинг и верификация даром.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        # Сам линтует .github/workflows/*.yml; run-блоки дополнительно гоняет
        # через shellcheck раннера. Битый workflow — это CI, который молча не
        # прогнался: ровно тот отказ, который нельзя увидеть из зелёной галочки.
        env:
          # Тот же порог, что у репозиторного shellcheck-гейта. Без него
          # actionlint гоняет shellcheck на info-уровне, и вердикт зависит от
          # ВЕРСИИ shellcheck на раннере: первый же прогон покраснел на SC2015
          # (info), которое локальный 0.11 вообще не выдаёт.
          SHELLCHECK_OPTS: --severity=warning
        run: actionlint -color

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    # Только линтеры и проверки целостности — минуты хватает с запасом.
    # Тесты уехали в отдельный джоб: держать их здесь значило узнавать о
    # сломанном синтаксисе через двадцать минут.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests/test_release_manifest_complete.sh diffs the last
          # two release commits to prove every changed deliverable is declared in
          # changed_files. With the default shallow clone those commits are absent
          # and the check degrades to a skip — i.e. exactly no protection.
          fetch-depth: 0

      - name: Install shellcheck and lua
        # lua is needed because tests/run_all.sh now picks up
        # tests/test_http_classifier.sh which invokes a lua mock-harness.
        # Without lua here, the wrapper would skip silently (per its
        # graceful-skip semantics for local devs without lua).
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.3

      - name: Run shellcheck
        run: |
          # Print the version: this runner's shellcheck is NOT the one a developer
          # has locally, and the codes differ between them. SC3013 (`-ef` is not
          # POSIX) failed this job while a newer local 0.11.0 stayed silent about
          # it at every severity, so "clean on my machine" proved nothing.
          shellcheck --version | sed -n 's/^version:/shellcheck /p'
          # SC1007: `LD_LIBRARY_PATH= ndmc ...` is an INTENTIONAL env-prefix (clear
          # Entware's OpenSSL path so ndmc works on KeenOS 4.3+/5.x — see p-57.1);
          # ShellCheck false-flags it as an accidental assignment. Excluded.
          # (Капитализация «ShellCheck» в этих комментариях не косметика: строка
          # комментария, начинающаяся с «# shellcheck», парсится как директива
          # и роняет actionlint ошибкой SC1072.)
          # files/init.d/S* have NO .sh extension, so the -name '*.sh' mask never saw them —
          # 240 lines of tunnel-lifecycle shell were shipping unlinted. Check them explicitly.
          # Same trap, one directory up: files/S99zapret2.new is the MAIN service script
          # (1600+ lines, the whole start/stop/firewall path) and matched neither mask —
          # a hard syntax error in it survived the entire 32-suite run and this job.
          # scripts/*.sh is release tooling, never shipped to a router — but it is what
          # generates the digests routers verify against, so a bug there fails every
          # update closed. Linted with everything else.
          { find . -name '*.sh' \( -path './z2k.sh' -o -path './z2k_cleanup.sh' -o -path './lib/*.sh' -o -path './files/*.sh' -o -path './tests/*.sh' -o -path './scripts/*.sh' -o -path './webpanel/cgi/*.sh' \); \
            find ./files/init.d -type f -name 'S*'; \
            find ./files -maxdepth 1 -type f -name 'S*'; } \
            | xargs shellcheck --severity=warning --exclude=SC1007,SC1090,SC1091,SC3043,SC3040,SC2034,SC2148,SC2154

      - name: Syntax-check every shipped shell script
        run: |
          # ShellCheck parses, but it does not guarantee the target shell accepts
          # the file. dash is the closest CI proxy for the router's BusyBox ash.
          rc=0
          for f in $(find ./files ./lib ./webpanel/cgi -type f \( -name '*.sh' -o -name 'S*' \) 2>/dev/null) ./z2k.sh ./z2k_cleanup.sh; do
            [ -f "$f" ] || continue
            if ! dash -n "$f" 2>/tmp/synerr; then
              echo "SYNTAX ERROR in $f:"; cat /tmp/synerr; rc=1
            fi
          done
          exit $rc

      - name: Манифест — либо ровно опубликованный, либо новый и подписанный
        run: |
          # ДВА СОСТОЯНИЯ, И ТРЕТЬЕГО БЫТЬ НЕ ДОЛЖНО.
          #
          # Манифест подписан офлайн-ключом, и подпись покрывает ВЕСЬ файл,
          # включая карту сумм. Значит любая правка манифеста без переподписи
          # делает подпись невалидной, а роутер с защёлкнутым храповиком такой
          # релиз отвергает — отказ одновременный и у всех.
          #
          # Раньше здесь требовалось «карта сходится с деревом» на КАЖДОМ
          # коммите. Из-за этого карту приходилось регенерировать при каждой
          # правке доставляемого файла, подпись после этого не сходилась, и её
          # проверку пришлось сделать пропускаемой. Пропуск и заметил ревьюер —
          # справедливо: гейт, который сам себя выключает, не гейт.
          #
          # Правильное состояние проще: между релизами манифест НЕ МЕНЯЕТСЯ
          # ВООБЩЕ. Он и так описывает последний выпущенный срез, а рабочая
          # ветка людям не видна. Карту пересобирает release.sh — там же, где
          # накладывает подпись, одним шагом.
          git fetch -q origin z2k-enhanced 2>/dev/null || true
          _pub=$(git show origin/z2k-enhanced:UPDATES.json 2>/dev/null \
                 | sed -n 's/.*"current"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
          _cur=$(sed -n 's/.*"current"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' UPDATES.json | head -1)

          if [ -z "$_pub" ]; then
            # Нет опубликованного состояния (форк, первый прогон) — сверяем то,
            # что можем: карту с деревом.
            echo "опубликованный манифест недоступен — сверяю карту с деревом"
            sh scripts/gen_file_hashes.sh
            git diff --quiet -- UPDATES.json || {
              echo "::error::files_sha256 не соответствует дереву"
              git --no-pager diff --stat -- UPDATES.json; exit 1; }
            exit 0
          fi

          if [ "$_pub" = "$_cur" ]; then
            # Рабочий коммит. Манифест и подпись обязаны быть байт-в-байт теми,
            # что уже опубликованы: трогать их здесь нечем и незачем.
            if ! git diff --quiet "origin/z2k-enhanced" HEAD -- UPDATES.json UPDATES.json.sig; then
              echo "::error::манифест правлен вне релиза (current остался $_cur)."
              echo "Карту и подпись пересобирает только scripts/release.sh — верните файлы как есть."
              git --no-pager diff --stat "origin/z2k-enhanced" HEAD -- UPDATES.json UPDATES.json.sig
              exit 1
            fi
            echo "рабочий коммит: манифест не тронут (current=$_cur)"
            exit 0
          fi

          # Релизный коммит. Здесь карта обязана описывать ЭТО дерево, а подпись
          # — сходиться с опубликованным ключом. Ровно те байты, что уедут людям.
          echo "релизный коммит: $_pub -> $_cur"
          sh scripts/gen_file_hashes.sh
          if ! git diff --quiet -- UPDATES.json; then
            echo "::error::files_sha256 в UPDATES.json не соответствует дереву."
            echo "Запусти локально: sh scripts/gen_file_hashes.sh — и пересобери релиз."
            git --no-pager diff --stat -- UPDATES.json
            exit 1
          fi
          git checkout -- UPDATES.json 2>/dev/null || true
          if [ ! -s UPDATES.json.sig ]; then
            echo "::error::релиз без подписи — его отвергнет каждый роутер, уже принимавший подписанные"
            exit 1
          fi
          if ! openssl pkeyutl -verify -rawin -pubin -inkey files/etc/z2k-update-pub.pem \
                 -in UPDATES.json -sigfile UPDATES.json.sig >/dev/null 2>&1; then
            echo "::error::подпись манифеста не сходится с опубликованным ключом"
            exit 1
          fi
          echo "карта описывает дерево, подпись сходится"

  tests:
    name: Shell tests
    runs-on: ubuntu-latest
    # Отдельный джоб, а не хвост линтеров. Раньше всё жило в одном: сломанный
    # синтаксис узнавался через двадцать минут вместе с тестами, а вышедший за
    # лимит джоб GitHub помечает CANCELLED — это неотличимо от ручной отмены,
    # и вердикта нет ни у кого. Разделение даёт линтерам секунды, тестам —
    # свой честный лимит и своё имя в списке прогонов.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Полная история нужна тестам релизной оснастки: они сверяют два
          # последних релизных коммита. При shallow-клоне их просто нет, и
          # проверка вырождается в skip, то есть в отсутствие защиты.
          fetch-depth: 0

      - name: Install lua
        # test_http_classifier.sh гоняет lua-харнесс. Без lua набор молча
        # пропускает его (штатная деградация для разработчика без lua) — то
        # есть в CI проверка тихо исчезает.
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      # Форк движка нужен test_contains_differential.sh: он сверяет НАШУ
      # реализацию contains() с апстримной из common/base.sh. Без этого
      # каталога тест штатно уходит в skip — и до 2026-08-08 в CI он уходил
      # туда ВСЕГДА, потому что чекаутился только основной репозиторий.
      # То есть защита той самой зоны, где жил апстримный `${1#*$2}` на
      # 29-килобайтной строке (рестарт 25 c против 1.66 c), в автоматическом
      # прогоне не работала ни разу.
      - name: Checkout engine fork (for contains() differential)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: necronicle/zapret2-z2k
          ref: z2k-master
          path: zapret2-z2k-fork
          persist-credentials: false

      - name: Run shell unit tests
        # Z2K_FORK_DIR указывает на чекаут выше: тесты по умолчанию ищут форк
        # рядом с репозиторием ($HERE/../zapret2-z2k-fork), а на раннере он
        # лежит внутри рабочего каталога.
        env:
          Z2K_FORK_DIR: ${{ github.workspace }}/zapret2-z2k-fork
        run: sh tests/run_all.sh

  go:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Падение одного модуля не должно прятать вердикт по остальным: при
      # релизе важно видеть ПОЛНУЮ картину, а не первую красную джобу.
      fail-fast: false
      matrix:
        module: [mtproxy-client, rt-proxy, vps-relay, z2k-detect, z2k-verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.* а не go.sum: rt-proxy обходится stdlib и go.sum не имеет,
          # setup-go на несуществующий путь падает. go.mod как ключ кэша валиден.
          # (Раньше здесь были перечислены только mtproxy-client и vps-relay —
          # кэш для z2k-detect молча не работал.)
          cache-dependency-path: ${{ matrix.module }}/go.*

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          # Не стиль ради стиля: неотформатированный файл — это диффы, в которых
          # правка логики тонет в правках пробелов, и ровно так пропускаются баги.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::не отформатировано gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go test (race)
        working-directory: ${{ matrix.module }}
        env:
          # В run-скрипты значения матрицы попадают через env, а не через
          # ${{ }}-интерполяцию в тело скрипта: интерполяция в script body —
          # канонический вектор template injection (здесь значения свои и
          # статические, но привычка должна быть одна на все workflows).
          MODULE: ${{ matrix.module }}
        run: |
          # -race: все четыре модуля — конкурентные сетевые демоны (туннели,
          # пулы апстримов, вотчеры). Раннер amd64, но логика синхронизации,
          # которую он проверяет, та же, что поедет на MIPS.
          case "$MODULE" in
            z2k-detect)
              # internal/prober is excluded on purpose, not silenced: its tests drive a real
              # prober against a local listener and need socket privileges the runner does not
              # grant ("operation not permitted" on dial to 127.0.0.1). Everything else —
              # parsers, decision logic — is checked here, and the build step below is what
              # guarantees the package compiles at all.
              #
              # "They still run locally" was NOT true until 2026-08-08: scripts/ci_local.sh
              # carried the very same grep, so the package ran in no automated path at all —
              # the exclusion here quietly justified itself with a promise nothing kept.
              # ci_local.sh now runs ./... in full; this exclusion is the runner's limit only.
              # shellcheck disable=SC2046 # словоразбиение списка пакетов — намеренное
              go test -race -count=1 -cover $(go list ./... | grep -v '/internal/prober$') ;;
            *)
              go test -race -count=1 -cover ./... ;;
          esac

      - name: Cross-compile
        working-directory: ${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
        run: |
          # Арки и флаги берутся из build-matrix.tsv — единственного места, где
          # они объявлены. Раньше список жил здесь своей жизнью и разошёлся с
          # Makefile'ами: mtproxy-client/arm собирался тут с GOARM=5, а
          # выпускался с GOARM=7, то есть проверялся не тот бинарник.
          rc=0
          # shellcheck disable=SC2034 # bdir/prefix/sfx нужны сверке байтов ниже
          while IFS="$(printf '\t')" read -r mod pkg bdir prefix goarch sfx extra; do
            case "$mod" in ''|\#*) continue ;; esac
            [ "$mod" = "$MODULE" ] || continue
            [ "$extra" = "-" ] && extra=""
            echo "Building linux/$goarch $extra..."
            # shellcheck disable=SC2086 # $extra — набор присваиваний окружения
            env CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" $extra \
              go build -trimpath -ldflags="-s -w" -o /dev/null "$pkg" || rc=1
          done < build-matrix.tsv
          exit $rc

  binaries:
    name: Отгружаемые бинарники собираются из этого исходника
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Пересобрать и сверить байт-в-байт
        run: |
          set -eu
          # ЗАЧЕМ. Бинарники лежат в репозитории готовыми блобами, и ничто не
          # связывало их с исходником: правка main.go без пересборки проходила
          # молча. Это не гипотеза — так уже уезжал rt-proxy с непересобранным
          # SPKI-пином.
          #
          # Сборка воспроизводима: -trimpath -buildvcs=false -ldflags="-s -w" на
          # том же тулчейне дают байт в байт тот же файл. Тулчейн пиннится и
          # здесь, и в Makefile'ах (go1.25.12): на 1.26.x ловили _ENOSYS на MIPS,
          # и разъехавшийся тулчейн сам по себе даст расхождение байтов.
          #
          # mtproxy-client здесь НЕ проверяется: в его бинарник на сборке
          # вшивается Z2K_TUNNEL_SECRET через -X, и без секрета байты не
          # воспроизвести. Это осознанный пробел, а не забывчивость — решение,
          # класть ли секрет в Actions, за владельцем.
          fail=0
          while IFS="$(printf '\t')" read -r mod pkg bdir prefix goarch sfx extra; do
            case "$mod" in ''|\#*) continue ;; esac
            [ "$bdir" = "-" ] && continue          # vps-relay на роутеры не едет
            # mtproxy-client пропускаем: в его бинарник на сборке вшивается
            # Z2K_TUNNEL_SECRET через -X, и без секрета байты не воспроизвести.
            # Пробел осознанный и назван вслух, а не забыт.
            [ "$mod" = "mtproxy-client" ] && continue
            want="$bdir/$prefix-linux-$sfx"
            if [ ! -f "$want" ]; then
              echo "::error::нет отгружаемого $want"; fail=1; continue
            fi
            [ "$extra" = "-" ] && extra=""
            # shellcheck disable=SC2086 # $extra — набор присваиваний окружения
            ( cd "$mod" && env CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" $extra \
                go build -ldflags="-s -w" -trimpath -buildvcs=false -o /tmp/rebuilt "$pkg" ) || {
              echo "::error::$mod/$goarch не собирается"; fail=1; continue; }
            a=$(sha256sum /tmp/rebuilt | cut -d" " -f1)
            b=$(sha256sum "$want" | cut -d" " -f1)
            if [ "$a" = "$b" ]; then
              echo "  ok      $want"
            else
              echo "::error::$want не собирается из этого исходника (сборка $a, в репо $b)"
              fail=1
            fi
          done < build-matrix.tsv

          if [ "$fail" != "0" ]; then
            echo "::error::пересоберите: cd <модуль> && make all — и закоммитьте builds/"
            exit 1
          fi
          echo "все проверенные бинарники собираются из этого исходника"

  lua-check:
    name: Luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install luarocks, lua, luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks lua5.3 liblua5.3-dev
          sudo luarocks --lua-version=5.3 install luacheck

      - name: Run luacheck
        run: luacheck files/lua/*.lua --codes -q

      - name: Run lua unit tests
        # Direct invocation in addition to tests/run_all.sh in the
        # shellcheck job — defence-in-depth so a future change that
        # breaks tests/run_all.sh's wrapper discovery doesn't silently
        # skip the lua harness. Use the versioned binary explicitly:
        # `lua` symlink relies on update-alternatives which is not
        # guaranteed on minimal Ubuntu images.
        run: lua5.3 tests/test_http_classifier.lua

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # A green suite proves nothing by itself: it may assert on stubs, or guard behaviour
      # nobody depends on. This applies known real regressions to the code and requires the
      # suite to go RED for each. A surviving mutant is an unguarded behaviour — it failed
      # this repo three times already, so it is a build failure, not a warning.
      - name: Run mutants
        run: GO=go sh tests/mutation.sh
