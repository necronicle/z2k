name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Ручной запуск. 2026-08-06 релиз p-73 был запушен ровно в окно сбоя GitHub
  # Actions: ни одного рана не создалось вовсе — и перезапустить было НЕЧЕГО,
  # у workflow не было ручки. Релиз уехал юзерам без единого прогона CI и
  # валидировался вручную постфактум. workflow_dispatch — та самая ручка.
  workflow_dispatch:

# GITHUB_TOKEN по умолчанию умеет писать в репозиторий. Ни одной джобе здесь
# запись не нужна, а z2k-enhanced — это ветка, с которой роутеры тянут
# обновления напрямую: скомпрометированный шаг с пишущим токеном равен захвату
# канала доставки. Least privilege, расширять точечно на уровне джобы.
permissions:
  contents: read

# Наслоившиеся раны на одной ветке гасятся новыми — КРОМЕ z2k-enhanced: пуш
# туда — это выкладка байтов (новые установки видят их сразу), а вердикт CI на
# нём — вход CD-гейта в scripts/release.sh: без вердикта не собирается
# объявление версии флоту. Отменённый ран = релиз, который нельзя объявить.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/z2k-enhanced' }}

env:
  # Продовый тулчейн. Бинарники для роутеров собираются ИМЕННО go1.22.12:
  # 1.26.x ломает MIPS soft-float (см. память проекта / реальные краши).
  # Раньше тут стоял "stable" — CI годами доказывал, что код компилируется
  # тулчейном, которым никто ничего не шипит. Проверять надо то, что едет юзерам.
  GO_VERSION: "1.22.12"

jobs:
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # инструменту прод-паритет не нужен
          cache: false

      - name: Install actionlint
        # go install проверяет модуль по sum DB — пиннинг и верификация даром.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        # Сам линтует .github/workflows/*.yml; run-блоки дополнительно гоняет
        # через shellcheck раннера. Битый workflow — это CI, который молча не
        # прогнался: ровно тот отказ, который нельзя увидеть из зелёной галочки.
        env:
          # Тот же порог, что у репозиторного shellcheck-гейта. Без него
          # actionlint гоняет shellcheck на info-уровне, и вердикт зависит от
          # ВЕРСИИ shellcheck на раннере: первый же прогон покраснел на SC2015
          # (info), которое локальный 0.11 вообще не выдаёт.
          SHELLCHECK_OPTS: --severity=warning
        run: actionlint -color

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    # Только линтеры и проверки целостности — минуты хватает с запасом.
    # Тесты уехали в отдельный джоб: держать их здесь значило узнавать о
    # сломанном синтаксисе через двадцать минут.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests/test_release_manifest_complete.sh diffs the last
          # two release commits to prove every changed deliverable is declared in
          # changed_files. With the default shallow clone those commits are absent
          # and the check degrades to a skip — i.e. exactly no protection.
          fetch-depth: 0

      - name: Install shellcheck and lua
        # lua is needed because tests/run_all.sh now picks up
        # tests/test_http_classifier.sh which invokes a lua mock-harness.
        # Without lua here, the wrapper would skip silently (per its
        # graceful-skip semantics for local devs without lua).
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.3

      - name: Run shellcheck
        run: |
          # Print the version: this runner's shellcheck is NOT the one a developer
          # has locally, and the codes differ between them. SC3013 (`-ef` is not
          # POSIX) failed this job while a newer local 0.11.0 stayed silent about
          # it at every severity, so "clean on my machine" proved nothing.
          shellcheck --version | sed -n 's/^version:/shellcheck /p'
          # SC1007: `LD_LIBRARY_PATH= ndmc ...` is an INTENTIONAL env-prefix (clear
          # Entware's OpenSSL path so ndmc works on KeenOS 4.3+/5.x — see p-57.1);
          # ShellCheck false-flags it as an accidental assignment. Excluded.
          # (Капитализация «ShellCheck» в этих комментариях не косметика: строка
          # комментария, начинающаяся с «# shellcheck», парсится как директива
          # и роняет actionlint ошибкой SC1072.)
          # files/init.d/S* have NO .sh extension, so the -name '*.sh' mask never saw them —
          # 240 lines of tunnel-lifecycle shell were shipping unlinted. Check them explicitly.
          # Same trap, one directory up: files/S99zapret2.new is the MAIN service script
          # (1600+ lines, the whole start/stop/firewall path) and matched neither mask —
          # a hard syntax error in it survived the entire 32-suite run and this job.
          # scripts/*.sh is release tooling, never shipped to a router — but it is what
          # generates the digests routers verify against, so a bug there fails every
          # update closed. Linted with everything else.
          { find . -name '*.sh' \( -path './z2k.sh' -o -path './z2k_cleanup.sh' -o -path './lib/*.sh' -o -path './files/*.sh' -o -path './tests/*.sh' -o -path './scripts/*.sh' -o -path './webpanel/cgi/*.sh' \); \
            find ./files/init.d -type f -name 'S*'; \
            find ./files -maxdepth 1 -type f -name 'S*'; } \
            | xargs shellcheck --severity=warning --exclude=SC1007,SC1090,SC1091,SC3043,SC3040,SC2034,SC2148,SC2154

      - name: Syntax-check every shipped shell script
        run: |
          # ShellCheck parses, but it does not guarantee the target shell accepts
          # the file. dash is the closest CI proxy for the router's BusyBox ash.
          rc=0
          for f in $(find ./files ./lib ./webpanel/cgi -type f \( -name '*.sh' -o -name 'S*' \) 2>/dev/null) ./z2k.sh ./z2k_cleanup.sh; do
            [ -f "$f" ] || continue
            if ! dash -n "$f" 2>/tmp/synerr; then
              echo "SYNTAX ERROR in $f:"; cat /tmp/synerr; rc=1
            fi
          done
          exit $rc

      - name: UPDATES.json file digests are in sync with the tree
        run: |
          # Routers verify every downloaded file against the files_sha256 map in
          # UPDATES.json. A map that lags the tree does not fail quietly like the
          # bug it replaces — it fails CLOSED: good files get rejected and the
          # update aborts for everyone. So drift has to die here, not in the field.
          sh scripts/gen_file_hashes.sh
          if ! git diff --quiet -- UPDATES.json; then
            echo "::error::files_sha256 в UPDATES.json не соответствует дереву."
            echo "Запусти локально: sh scripts/gen_file_hashes.sh — и закоммить результат."
            git --no-pager diff --stat -- UPDATES.json
            exit 1
          fi
          echo "манифест синхронен"

  tests:
    name: Shell tests
    runs-on: ubuntu-latest
    # Отдельный джоб, а не хвост линтеров. Раньше всё жило в одном: сломанный
    # синтаксис узнавался через двадцать минут вместе с тестами, а вышедший за
    # лимит джоб GitHub помечает CANCELLED — это неотличимо от ручной отмены,
    # и вердикта нет ни у кого. Разделение даёт линтерам секунды, тестам —
    # свой честный лимит и своё имя в списке прогонов.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Полная история нужна тестам релизной оснастки: они сверяют два
          # последних релизных коммита. При shallow-клоне их просто нет, и
          # проверка вырождается в skip, то есть в отсутствие защиты.
          fetch-depth: 0

      - name: Install lua
        # test_http_classifier.sh гоняет lua-харнесс. Без lua набор молча
        # пропускает его (штатная деградация для разработчика без lua) — то
        # есть в CI проверка тихо исчезает.
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Run shell unit tests
        run: sh tests/run_all.sh

  go:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Падение одного модуля не должно прятать вердикт по остальным: при
      # релизе важно видеть ПОЛНУЮ картину, а не первую красную джобу.
      fail-fast: false
      matrix:
        module: [mtproxy-client, rt-proxy, vps-relay, z2k-detect]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.* а не go.sum: rt-proxy обходится stdlib и go.sum не имеет,
          # setup-go на несуществующий путь падает. go.mod как ключ кэша валиден.
          # (Раньше здесь были перечислены только mtproxy-client и vps-relay —
          # кэш для z2k-detect молча не работал.)
          cache-dependency-path: ${{ matrix.module }}/go.*

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          # Не стиль ради стиля: неотформатированный файл — это диффы, в которых
          # правка логики тонет в правках пробелов, и ровно так пропускаются баги.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::не отформатировано gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go test (race)
        working-directory: ${{ matrix.module }}
        env:
          # В run-скрипты значения матрицы попадают через env, а не через
          # ${{ }}-интерполяцию в тело скрипта: интерполяция в script body —
          # канонический вектор template injection (здесь значения свои и
          # статические, но привычка должна быть одна на все workflows).
          MODULE: ${{ matrix.module }}
        run: |
          # -race: все четыре модуля — конкурентные сетевые демоны (туннели,
          # пулы апстримов, вотчеры). Раннер amd64, но логика синхронизации,
          # которую он проверяет, та же, что поедет на MIPS.
          case "$MODULE" in
            z2k-detect)
              # internal/prober is excluded on purpose, not silenced: its tests drive a real
              # prober against a local listener and need socket privileges the runner does not
              # grant ("operation not permitted" on dial to 127.0.0.1). They still run locally and
              # on a router. Everything else — parsers, decision logic — is checked here, and the
              # build step below is what guarantees the package compiles at all.
              # shellcheck disable=SC2046 # словоразбиение списка пакетов — намеренное
              go test -race -count=1 -cover $(go list ./... | grep -v '/internal/prober$') ;;
            *)
              go test -race -count=1 -cover ./... ;;
          esac

      - name: Cross-compile
        working-directory: ${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
        run: |
          # Каждый модуль собирается под все арки, на которые он реально
          # ставится (списки и флаги — исторические, подобраны эмпирически):
          #   MIPS/MIPSLE: softfloat (Keenetic MT7621, KN-3610 etc.)
          #   mtproxy-client ARM: GOARM=5 (ARMv5, no VFP — max compat)
          #   rt-proxy ARM: GOARM=7
          #   vps-relay работает только на VPS (amd64) — кросс-матрица не нужна.
          # CGO_ENABLED=0 (static), -trimpath -ldflags="-s -w" (reproducible, strip).
          case "$MODULE" in
            mtproxy-client) TARGETS="linux/arm64 linux/arm linux/amd64 linux/mips linux/mipsle linux/mips64le linux/ppc64 linux/riscv64 linux/386"; PKG="." ;;
            rt-proxy)       TARGETS="linux/arm64 linux/arm linux/amd64 linux/mips linux/mipsle"; PKG="." ;;
            z2k-detect)     TARGETS="linux/arm64 linux/mipsle linux/mips64le"; PKG="./cmd/z2k-detect" ;;
            vps-relay)      TARGETS="linux/amd64"; PKG="./..." ;;
          esac
          for t in $TARGETS; do
            GOOS="${t%%/*}"; GOARCH="${t##*/}"; EXTRA=""
            case "$MODULE/$GOARCH" in
              mtproxy-client/arm) EXTRA="GOARM=5" ;;
              rt-proxy/arm)       EXTRA="GOARM=7" ;;
              */mips|*/mipsle)    EXTRA="GOMIPS=softfloat" ;;
              */mips64le)         EXTRA="GOMIPS64=softfloat" ;;
            esac
            echo "Building $GOOS/$GOARCH $EXTRA..."
            env CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" $EXTRA \
              go build -trimpath -ldflags="-s -w" -o /dev/null "$PKG"
          done

  lua-check:
    name: Luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install luarocks, lua, luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks lua5.3 liblua5.3-dev
          sudo luarocks --lua-version=5.3 install luacheck

      - name: Run luacheck
        run: luacheck files/lua/*.lua --codes -q

      - name: Run lua unit tests
        # Direct invocation in addition to tests/run_all.sh in the
        # shellcheck job — defence-in-depth so a future change that
        # breaks tests/run_all.sh's wrapper discovery doesn't silently
        # skip the lua harness. Use the versioned binary explicitly:
        # `lua` symlink relies on update-alternatives which is not
        # guaranteed on minimal Ubuntu images.
        run: lua5.3 tests/test_http_classifier.lua

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # A green suite proves nothing by itself: it may assert on stubs, or guard behaviour
      # nobody depends on. This applies known real regressions to the code and requires the
      # suite to go RED for each. A surviving mutant is an unguarded behaviour — it failed
      # this repo three times already, so it is a build failure, not a warning.
      - name: Run mutants
        run: GO=go sh tests/mutation.sh
