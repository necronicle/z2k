<script>
  /* No-FOUC theme bootstrap — runs before style.css загружается.
     Без него юзер с сохранённой светлой темой увидит мигание тёмной
     перед applyTheme() из app.js. */
  (function() {
    try {
      var mode = localStorage.getItem('z2k-theme') || 'auto';
      var resolved = mode === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : mode;
      if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) { /* localStorage disabled — остаёмся на dark default */ }
  })();
</script>
