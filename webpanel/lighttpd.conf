# z2k webpanel lighttpd config.
#
# Installed at /opt/zapret2/webpanel/lighttpd.conf.
# Метки-заполнители в этом файле подставляются install.sh перед тем, как он
# попадёт на своё место. Перечислять их здесь по именам НЕЛЬЗЯ: sed заменит их
# и в тексте комментария, и шапка установленного конфига будет читаться как
# бессмыслица («Values 8088, 192.168.1.1, … are substituted by»), а grep по
# имени сокета начнёт находить лишнюю строку.

server.document-root        = "@WWW_DIR@"
server.port                 = @PORT@
server.bind                 = "@BIND@"

# ВТОРОЙ СОКЕТ — ДЛЯ IPv6.
#
# server.bind принимает ровно один адрес, поэтому слушать и IPv4, и IPv6
# можно только так: второй сокет отдельным блоком. Строка подставляется
# установщиком и по умолчанию ПУСТАЯ — панель как слушала один адрес IPv4,
# так и слушает, обновление ничего не включает само.
#
# Задаётся в меню: [P] → «Адрес и порт панели». Правка этого файла руками
# смысла не имеет — он генерируется из шаблона при каждой установке, и
# дописанное здесь стирается ближайшим обновлением. Ровно на это и жаловались.
#
# Пустой блок {} — не ошибка: настройки внутри наследуются глобальные, нужен
# сам факт открытия сокета.
@IPV6_SOCKET@
server.pid-file             = "/var/run/z2k-webpanel.pid"
server.errorlog             = "/tmp/z2k-log/z2k-webpanel-error.log"
server.tag                  = "z2k-panel"

server.modules = (
    "mod_indexfile",
    "mod_cgi",
    "mod_dirlisting",
    "mod_setenv",
)

# Cache headers: для admin-панели, которая часто обновляется при
# auto-update, держим ETag-based revalidation (no aggressive caching).
# `no-cache` означает: можно cache'нуть, но ПЕРЕД использованием
# обязательно валидируйся через If-None-Match. ETag уже отдаёт lighttpd —
# браузер получит 304 если ничего не менялось, или fresh content если
# деплой принёс изменения. Юзеру не нужно делать hard refresh после patch.
setenv.add-response-header = (
    "Cache-Control" => "no-cache, must-revalidate",
    # Панель не должна открываться во фрейме: без своей авторизации она иначе
    # кликджекается с любой страницы в обход origin-проверок в cgi/auth.sh.
    "X-Frame-Options" => "DENY",
    "Content-Security-Policy" => "frame-ancestors 'none'",
    "X-Content-Type-Options" => "nosniff"
)

# Килобайты. Без этого lighttpd буферизует тело ЛЮБОГО размера (в tmpfs, т.е.
# в RAM) ещё до запуска CGI, и проверка CONTENT_LENGTH внутри api.sh срабатывает
# уже после того, как память съедена. 4 МБ — вдвое больше нашего же потолка на
# загрузку списка (2 МБ).
server.max-request-size = 4096

index-file.names = ( "index.html" )

# Disable directory listing (the root cause of the bug with the old panel —
# empty dir served as a file listing). Prefer a 404 instead.
dir-listing.activate = "disable"
dir-listing.hide-dotfiles = "enable"

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "application/javascript; charset=utf-8",
    ".json" => "application/json; charset=utf-8",
    ".svg"  => "image/svg+xml",
    ".png"  => "image/png",
    ".ico"  => "image/x-icon",
    ".txt"  => "text/plain; charset=utf-8",
    # Шрифты панели лежат рядом с ней и НЕ качаются из интернета: устройство
    # стоит ради обхода блокировок, и ждать чужой CDN на первом экране нельзя.
    # Без этой строки lighttpd отдал бы их как application/octet-stream —
    # браузеры такой ответ для @font-face молча игнорируют, и панель осталась
    # бы на системном шрифте, а причина была бы не видна ниоткуда.
    ".woff2" => "font/woff2",
    ""      => "application/octet-stream",
)

# CGI: только /cgi-bin/api (симлинк на /opt/zapret2/webpanel/cgi/api.sh)
# исполняется как sh. Раньше условие было "^/cgi-bin/", т.е. «выполнить как
# root-скрипт всё, что окажется в этом каталоге» — записи туда сейчас нет, но
# конфиг обещал куда больше, чем требуется.
$HTTP["url"] =~ "^/cgi-bin/api(/|$)" {
    cgi.assign = ( "" => "/bin/sh" )
}

# No auth: panel is LAN-only by design, trusts everything on the local
# network. Same trust level as the Keenetic web UI at 192.168.1.1.
# CSRF protection is still enforced at the CGI layer via same-origin
# Referer check for all POST requests.
