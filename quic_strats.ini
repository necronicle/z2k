# ===============================
# UDP Strategies for nfqws2
# ===============================
# Each section [strategy_name] contains:
# - desc: Description of strategy
# - args: Lua desync arguments (WITHOUT --filter-udp, --hostlist - they come from categories)

[discord_voice_autocircular]
desc=Discord voice/video autocircular modern (12 strategies, z2k morph prioritized)
args=--filter-udp=50000-50099,1400,3478-3481,5349,19294-19344 --filter-l7=discord,stun --in-range=-d100 --out-range=-d100 --payload=quic_initial,discord_ip_discovery --lua-desync=circular:fails=3:time=60:udp_in=1:udp_out=4:key=discord_voice:nld=2:hostkey=z2k_nohost_key --lua-desync=z2k_quic_morph_v2:payload=quic_initial:dir=out:packets=2:noise=2:pad_min=8:pad_max=56:strategy=1 --lua-desync=z2k_timing_morph:payload=quic_initial:dir=out:packets=2:chance=80:fakes=2:pad_min=8:pad_max=64:strategy=2 --lua-desync=fake:payload=all:blob=0x00000000000000000000000000000000:repeats=2:out_range=-d10:strategy=2 --lua-desync=send:payload=quic_initial:dir=out:ipfrag=z2k_ipfrag3_tiny:ipfrag_pos_udp=8:ipfrag_pos2=32:ipfrag_overlap12=8:ipfrag_overlap23=8:ipfrag_disorder:ipfrag_next2=255:strategy=2 --lua-desync=drop:payload=quic_initial:dir=out:strategy=2 --lua-desync=z2k_quic_morph_v2:payload=quic_initial:dir=out:packets=2:profile=2:noise=2:pad_min=8:pad_max=64:ipfrag_pos_udp=16:ipfrag_pos2=56:ipfrag_overlap12=16:ipfrag_overlap23=8:strategy=3 --lua-desync=fake:payload=all:blob=quic_google:repeats=3:ip_autottl=-2,3-20:out_range=-d3:strategy=4 --lua-desync=fake:payload=all:blob=quic5:repeats=4:ip_autottl=-2,3-20:out_range=-n5:strategy=5 --lua-desync=fake:payload=all:blob=fake_default_quic:repeats=6:ip_autottl=-2,3-20:out_range=-d100:strategy=6 --lua-desync=fake:payload=all:blob=quic5:repeats=6:ip_autottl=-2,3-20:out_range=-n2:strategy=7 --lua-desync=send:payload=quic_initial:dir=out:ipfrag=z2k_ipfrag3:ipfrag_pos_udp=16:ipfrag_pos2=48:ipfrag_overlap12=8:ipfrag_overlap23=8:ipfrag_disorder:ipfrag_next2=255:strategy=8 --lua-desync=drop:payload=quic_initial:dir=out:strategy=8 --lua-desync=udplen:payload=quic_initial:dir=out:increment=4:strategy=9 --lua-desync=fake:payload=all:blob=quic5:repeats=2:strategy=9 --lua-desync=udplen:payload=quic_initial:dir=out:increment=8:pattern=0xFEA82025:strategy=10 --lua-desync=fake:payload=all:blob=quic5:repeats=2:strategy=10 --lua-desync=fake:payload=all:blob=0x00000000000000000000000000000000:repeats=2:strategy=11 --lua-desync=send:payload=quic_initial:dir=out:ipfrag:ipfrag_pos_udp=8:strategy=11 --lua-desync=drop:payload=quic_initial:dir=out:strategy=11 --lua-desync=fake:payload=all:blob=fake_default_quic:repeats=3:strategy=12

[quic_autocircular]
# udp_in/udp_out: пороги детекторов, см. подробный разбор в
# lib/config_official.sh у объявления quic_udp. Коротко: udp_in обязан быть
# НИЖЕ окна перехвата NFQWS2_UDP_PKT_IN, иначе успех недостижим, счётчик
# неудач не сбрасывается и страта ротируется на здоровом трафике.
# Плечи — QUIC-страты референсного набора без собственных вариаций. Записи
# nfqws1 переведены на nfqws2 и сверены на дифференциальном стенде побайтно
# (Initial одной и двумя датаграммами): fake nfqws1 на UDP сам переотправляет
# оригинал и роняет его из очереди, поэтому здесь fake + send + drop; cutoff=nN
# стоит на каждом действии плеча как out_range=-nN. Плечи стоят под
# --payload=quic_initial: send сам payload= не проверяет и под --payload=all
# дублировал каждый короткий пакет потока. Состав охраняет
# tests/test_quic_pool_reference.sh.
desc=QUIC autocircular (ютуб + списки РКН): референсный набор один в один, 10 плеч
args=--in-range=a --out-range=a --payload=all --lua-desync=circular:fails=3:time=60:udp_in=1:udp_out=5:key=quic:nld=2 --payload=quic_initial --lua-desync=fake:blob=quic_google:repeats=6:strategy=1 --lua-desync=send:dir=out:strategy=1 --lua-desync=drop:dir=out:strategy=1 --lua-desync=fake:blob=quic_google:repeats=11:strategy=2 --lua-desync=send:dir=out:strategy=2 --lua-desync=drop:dir=out:strategy=2 --lua-desync=fake:blob=quic6:repeats=2:out_range=-n3:strategy=3 --lua-desync=udplen:increment=8:pattern=0x0F0F0E0F:out_range=-n3:strategy=3 --lua-desync=send:dir=out:out_range=-n3:strategy=3 --lua-desync=drop:dir=out:out_range=-n3:strategy=3 --lua-desync=fake:blob=fake_default_quic:repeats=6:strategy=4 --lua-desync=send:dir=out:strategy=4 --lua-desync=drop:dir=out:strategy=4 --lua-desync=fake:blob=quic5:repeats=3:out_range=-n3:strategy=5 --lua-desync=send:dir=out:ipfrag:ipfrag_pos_udp=8:out_range=-n3:strategy=5 --lua-desync=drop:dir=out:out_range=-n3:strategy=5 --lua-desync=fake:blob=quic4:repeats=2:out_range=-n3:strategy=6 --lua-desync=udplen:increment=4:out_range=-n3:strategy=6 --lua-desync=send:dir=out:out_range=-n3:strategy=6 --lua-desync=drop:dir=out:out_range=-n3:strategy=6 --lua-desync=fake:blob=quic4:repeats=2:out_range=-n4:strategy=7 --lua-desync=udplen:increment=8:pattern=0xFEA82025:out_range=-n4:strategy=7 --lua-desync=send:dir=out:out_range=-n4:strategy=7 --lua-desync=drop:dir=out:out_range=-n4:strategy=7 --lua-desync=fake:blob=quic5:repeats=2:out_range=-n3:strategy=8 --lua-desync=udplen:increment=25:out_range=-n3:strategy=8 --lua-desync=send:dir=out:out_range=-n3:strategy=8 --lua-desync=drop:dir=out:out_range=-n3:strategy=8 --lua-desync=fake:blob=quic1:repeats=6:out_range=-n3:strategy=9 --lua-desync=send:dir=out:out_range=-n3:strategy=9 --lua-desync=drop:dir=out:out_range=-n3:strategy=9 --lua-desync=fake:blob=quic_google:repeats=8:strategy=10 --lua-desync=send:dir=out:strategy=10 --lua-desync=drop:dir=out:strategy=10
