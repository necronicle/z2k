[Service]
# Секреты живут в файле с правами 600, а не в командной строке.
# --events-dir и --asn-table — наблюдаемость (спека v2, план 1).
EnvironmentFile=/etc/z2k/secrets.env
# Журнал событий: под ProtectSystem=strict записать можно только в каталоги,
# объявленные юнитом. LogsDirectory создаёт /var/log/z2k-relay от имени
# пользователя службы и открывает его на запись (02.09.2026 без этой строки
# новый релей падал на старте, откат занял полторы минуты).
LogsDirectory=z2k-relay
# Плавная остановка: RETRY_AFTER клиентам v2 и до 90 с ожидания (--drain-timeout).
TimeoutStopSec=120
ExecStart=
ExecStart=/usr/local/bin/z2k-vps-relay --listen=127.0.0.1:8080 --secret=env:Z2K_SECRET --secret-prev=env:Z2K_SECRET_PREV --resolve-secret=env:Z2K_RESOLVE_SECRET --registry-path=/var/lib/z2k-relay/registry.json --dial-limit-per-target=32 --dial-throttle-timeout=3s --per-stream-queue-bytes=2097152 --session-queue-bytes=25165824 --session-queue-depth=1024 --control-queue-depth=256 --dial-stats-interval=30s --extra-cidrs=168.119.95.238/32 --require-per-install --admin-addr=127.0.0.1:9098 --admin-token=env:Z2K_ADMIN_TOKEN --install-snapshot-interval=10m --events-dir=/var/log/z2k-relay --asn-table=/var/lib/z2k-relay/ip2asn-v4.tsv
