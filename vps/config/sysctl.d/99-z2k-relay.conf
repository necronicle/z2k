# z2k VPS relay tuning — written 2026-05-11
# Profile: many concurrent outbound TCP to TG DC + inbound from routers
# Goal: BBR pacing accuracy, burst headroom, reconnect-storm survival

# --- S-tier: pacing + latency ---
# BBR wants sch_fq for packet-accurate pacing (vs fq_codel coarse)
net.core.default_qdisc = fq

# Cap unsent socket queue → relay learns backpressure earlier,
# kills HoL blocking from oversized kernel send buffers
net.ipv4.tcp_notsent_lowat = 131072

# Do not reset cwnd after idle — relay traffic is bursty (chat scroll → pause → burst)
net.ipv4.tcp_slow_start_after_idle = 0

# --- A-tier: reconnect-storm headroom ---
# TIME_WAIT bucket: 8192 default is 16x too small for relay reconnect storms
net.ipv4.tcp_max_tw_buckets = 131072

# Orphan socket cap during close storms — avoid TCPAbortOnMemory drops
net.ipv4.tcp_max_orphans = 65536

# Listen queue when many routers SYN simultaneously after DC switch
net.ipv4.tcp_max_syn_backlog = 16384

# TCP memory pages (4K each) — pressure/high/max
# 350MB / 468MB / 703MB out of 2GB total RAM
net.ipv4.tcp_mem = 87900 117400 175800

# --- B-tier: burst buffers ---
net.core.netdev_max_backlog = 5000
net.core.somaxconn = 8192

# Relay heap should never swap — page cache cheap to drop instead
vm.swappiness = 10

# Предохранитель на всплеск подключений.
#
# Замер 31.08.2026: TCPReqQFullDrop = 1118 при ListenOverflows = 0 — переполняется
# SYN-очередь, и с выключенными cookies ядро МОЛЧА теряет пакет. Клиент не видит
# ни отказа, ни сброса: он ждёт ретрансмиссии и при таймауте в 3 с считает узел
# недоступным.
#
# С cookies всплеск проходит ценой части расширений TCP для тех соединений,
# которые пришлись на переполнение (window scaling и SACK восстанавливаются из
# метки времени, tcp_timestamps=1 стоит). Это деградация вместо отказа.
#
# Значение 1, а не 2: двойка включает cookies всегда и тем самым стирает сигнал
# перегрузки — мы перестанем видеть, что очередь переполняется.
net.ipv4.tcp_syncookies = 1

# Таблица RFS: держит поток на том ядре, где его читает процесс.
# Работает в паре с rps_flow_cnt из z2k-net-tuning.service — без этой
# строки rps_flow_cnt не имеет силы. Обоснование и замер см. в bin/net-tuning.sh.
net.core.rps_sock_flow_entries = 32768
