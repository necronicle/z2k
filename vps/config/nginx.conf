# z2k SNI router — append to /etc/nginx/nginx.conf at top level.
# Routes :443 by SNI: own domains → Caddy на :8443, остальные →
# transparent TLS passthrough на реальный SNI:443.

stream {
    # External resolver — НЕ свой DNS (избегаем петлю)
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    # Фаза preread — ожидание ClientHello. Умолчание в 30 секунд держит
    # слот за тем, кто соединился и молчит: один SYN плюс рукопожатие
    # покупают полминуты ресурса. Настоящий клиент присылает ClientHello
    # сразу — замер 31.08.2026 даёт 6 мс на здоровом соединении.
    preread_timeout 5s;

    # Logging: без client IP, только для отладки
    access_log off;
    error_log /var/log/nginx/z2k-stream-error.log warn;

    # Map SNI → upstream
    map $ssl_preread_server_name $z2k_upstream {
        # only our own SNI; everything else closed (DNS-project decommissioned 2026-04-29)
        "213.176.74.63.nip.io"        127.0.0.1:8443;
        # z2k relay: whatsapp/ticketmaster — SNI-passthrough to real backend (EU-egress bypass of RU IP-block/WAF)
        ~^(?<wa>([a-z0-9-]+[.])*whatsapp[.](com|net))$  $wa:443;
        ~^(?<tn>([a-z0-9-]+[.])*ticketm[.]net)$         $tn:443;
        # GitHub: RU IP-blocks the Fastly anycast 185.199.108-111.133 (raw/gist/
        # avatars/objects/release-assets .githubusercontent.com) so users' hosts
        # pins to those IPs stopped working. Passthrough via our EU egress: users
        # pin these hostnames to THIS VPS instead. Covers *.githubusercontent.com
        # and github.com/*.github.com (github.com, codeload, api, objects).
        ~^(?<ghuc>([a-z0-9-]+[.])*githubusercontent[.]com)$  $ghuc:443;
        ~^(?<ghub>([a-z0-9-]+[.])*github[.]com)$             $ghub:443;
        default                       "";
    }

    # Куда отправить поток ВНУТРИ nginx. Разделение нужно из-за proxy_protocol:
    # включить его можно только на весь server-блок, а сквозные проходы
    # (whatsapp, ticketmaster, github) заголовка не ждут и от него сломались бы.
    #
    # Поэтому главный блок шлёт заголовок ВСЕМ, но не наружу, а на два своих
    # слушателя: наш релей его принимает (caddy настроен), а для сквозных стоит
    # промежуточный блок ниже, который заголовок читает и дальше НЕ передаёт.
    #
    # Зачем всё это: без заголовка релей видит соединение от самого nginx и
    # штампует всем 127.0.0.1 — полторы тысячи разных людей неотличимы,
    # и поймать того, кто раздаёт наш туннель дальше, нечем.
    map $z2k_upstream $z2k_route {
        ""                 "";
        "127.0.0.1:8443"   127.0.0.1:8443;   # наш релей — принимает заголовок
        # GitHub — на отдельную снималку с IPv6-only резолвером. Замер
        # 2026-08-21 с этого VPS: коннект к GitHub по IPv4 не проходит в 19%
        # случаев (23 из 120), по IPv6 — 0 из 120. Резолвер стоял ipv6=off, то
        # есть nginx намеренно ходил только по ломающейся дороге. Клиент при
        # этом видел завершённое рукопожатие и тишину: nginx молча ждал апстрим,
        # а мы считали, что теряется пакет.
        # ТОЛЬКО хосты, у которых есть AAAA. Проверено 2026-08-21:
        # raw. и avatars. — есть; github.com, api., codeload., objects.,
        # release-assets., gist. — IPv4-only. Увести их на v6-only резолвер
        # значило бы не ускорить, а отключить: имя просто не разрешается.
        # Список именами, а не маской, ровно поэтому — маска затянула бы сюда
        # и те, что без AAAA, причём молча.
        "raw.githubusercontent.com:443"      127.0.0.1:8444;
        "avatars.githubusercontent.com:443"  127.0.0.1:8444;
        default            127.0.0.1:8446;   # остальные сквозные — как были
    }

    # Rate limit per source IP (anti-abuse)
    limit_conn_zone $binary_remote_addr zone=z2k_perip:10m;

    # Промежуточный блок для сквозных проходов: читает proxy_protocol от
    # главного блока и forwards дальше уже без него. SNI перечитывается заново,
    # поэтому $z2k_upstream здесь снова даёт настоящий backend.
    # GitHub-снималка: тот же сквозной проход, но резолвер отдаёт только AAAA.
    # Короткий connect — чтобы при отказе клиент быстро ушёл в свою запасную
    # цепочку (jsdelivr/gh-proxy/ndmc), а не висел молча.
    server {
        listen      127.0.0.1:8444 proxy_protocol backlog=8192;

        resolver 1.1.1.1 8.8.8.8 ipv4=off valid=300s;
        resolver_timeout 5s;

        ssl_preread on;
        proxy_pass  $z2k_upstream;

        # СЕМЕЙСТВО АДРЕСОВ ЗДЕСЬ ОТЛИЧАЕТСЯ ОТ ОБЩЕГО НАМЕРЕННО (ipv4=off
        # выше). Флипнуть обратно пробовали 31.08.2026: по IPv4 через ЭТОТ
        # маршрут среднее рукопожатие выросло 0.302 -> 1.560 с и появился
        # полный двадцатисекундный таймаут, которого на IPv6 не было ни разу.
        # Откачено в тот же час. Не менять без замера обоих семейств ЧЕРЕЗ
        # ХОП: напрямую с узла IPv4 быстрее, а через хоп — заметно хуже.
        proxy_connect_timeout 3s;
        # Перебор адресов ограничен. Имя даёт четыре адреса Fastly, они
        # обходятся по кругу, и без потолка худший случай равен четырём
        # таймаутам подряд — двенадцать секунд, когда клиент давно ушёл.
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 6s;
        proxy_timeout         600s;
        proxy_buffer_size     16k;
    }

    server {
        listen      127.0.0.1:8446 proxy_protocol backlog=8192;

        ssl_preread on;
        proxy_pass  $z2k_upstream;

        proxy_connect_timeout 10s;
        proxy_timeout         600s;
        proxy_buffer_size     16k;
    }


    # WhatsApp Noise-шлюз: протокол БЕЗ TLS и БЕЗ SNI, поэтому ssl_preread по нему
    # маршрутизировать не может — соединение просто висело принятым, а клиент
    # крутил спиннер вместо QR (поле 2026-08-28). Отдельный слушатель адресата
    # не выбирает: назначение здесь ровно одно, SNI не нужен.
    server {
        listen      5222 reuseport backlog=8192;
        listen      [::]:5222 reuseport backlog=8192;
        proxy_pass  g.whatsapp.net:5222;
        proxy_connect_timeout 10s;
        proxy_timeout         600s;
        limit_conn  z2k_perip 50;
    }

    server {
        # backlog задан ЯВНО. Умолчание 511 сводило на нет системный somaxconn
        # 8192: размер очереди берётся как min(listen backlog, somaxconn) в
        # момент listen(), поэтому системная настройка без этой строки не
        # значила ничего. Замер 31.08.2026: TCPReqQFullDrop = 1118 при
        # ListenOverflows = 0 — переполнялась именно SYN-очередь.
        #
        # При reuseport очередей столько, сколько сокетов (v4/v6 × воркер), и
        # 8192 относится к КАЖДОЙ. Поэтому syncookies включены тем же заходом:
        # иначе под флудом получаем до 32 тысяч полуоткрытых запросов.
        listen      443 reuseport backlog=8192;
        listen      [::]:443 reuseport backlog=8192;

        ssl_preread on;
        proxy_protocol on;
        proxy_pass  $z2k_route;

        # AI streaming-чаты — длинные long-poll
        proxy_connect_timeout 10s;
        proxy_timeout         600s;
        proxy_buffer_size     16k;

        limit_conn z2k_perip 50;
    }
}
