## z2k WARP registration relay — RESTRICTED HTTP CONNECT proxy.
## Purpose: let a router whose ISP DPI-blocks api.cloudflareclient.com enroll a
## usque/WARP device THROUGH this VPS (which reaches the CF reg API). It is NOT a
## general proxy: CONNECT is allowed ONLY to *.cloudflareclient.com:443, so even if
## the port is found it cannot be abused for anything but Cloudflare registration.
User tinyproxy
Group tinyproxy
Port 8119
Listen 0.0.0.0
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"
LogLevel Info
MaxClients 50
Allow 0.0.0.0/0
BasicAuth z2kwarp <СЕКРЕТ>
## CONNECT allowed only to 443
ConnectPort 443
## Destination allow-list: only Cloudflare's registration domain
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/z2k-filter"
FilterExtended On
FilterCaseSensitive Off
FilterURLs Off
