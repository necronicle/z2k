# /etc/systemd/system/z2k-relay.service.d/20-gomemlimit.conf
#
# Soft memory ceiling for the Go relay: keeps the process under ~1.5 GB on the
# 2 GB box, leaving headroom for nginx/caddy/OS. Paired with the shrunk
# per-connection WebSocket buffers (see the Upgrader in main.go) — together they
# take relay RSS from ~0.9 GB down to ~0.15-0.3 GB at ~1600 tunnels.
#
# Applied as a drop-in (non-invasive: does not touch the main unit's ExecStart
# or its secrets). Deploy: place this file, `systemctl daemon-reload`,
# `systemctl restart z2k-relay` (off-peak).
[Service]
Environment=GOMEMLIMIT=1500MiB
