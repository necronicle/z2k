# z2k SNI router — append to /etc/nginx/nginx.conf at top level.
# Routes :443 by SNI: own domains → Caddy на :8443, остальные →
# transparent TLS passthrough на реальный SNI:443.

stream {
    # External resolver — НЕ свой DNS (избегаем петлю)
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    # Logging: без client IP, только для отладки
    access_log off;
    error_log /var/log/nginx/z2k-stream-error.log warn;

    # Map SNI → upstream
    map $ssl_preread_server_name $z2k_upstream {
        # only our own SNI; everything else closed (DNS-project decommissioned 2026-04-29)
        "213.176.74.63.nip.io"        127.0.0.1:8443;
        # z2k relay: whatsapp/ticketmaster — SNI-passthrough to real backend (EU-egress bypass of RU IP-block/WAF)
        ~^(?<wa>([a-z0-9-]+[.])*whatsapp[.](com|net))$  $wa:443;
        ~^(?<tm>([a-z0-9-]+[.])*ticketmaster[.]com)$    $tm:443;
        ~^(?<tn>([a-z0-9-]+[.])*ticketm[.]net)$         $tn:443;
        ~^(?<tmn>([a-z0-9-]+[.])*ticketmaster[.]net)$  $tmn:443;
        ~^(?<ti>([a-z0-9-]+[.])*tmol[.]io)$            $ti:443;
        ~^(?<tc>([a-z0-9-]+[.])*tmol[.]co)$            $tc:443;
        ~^(?<tco>([a-z0-9-]+[.])*tmconst[.]com)$            $tco:443;
        # GitHub: RU IP-blocks the Fastly anycast 185.199.108-111.133 (raw/gist/
        # avatars/objects/release-assets .githubusercontent.com) so users' hosts
        # pins to those IPs stopped working. Passthrough via our EU egress: users
        # pin these hostnames to THIS VPS instead. Covers *.githubusercontent.com
        # and github.com/*.github.com (github.com, codeload, api, objects).
        ~^(?<ghuc>([a-z0-9-]+[.])*githubusercontent[.]com)$  $ghuc:443;
        ~^(?<ghub>([a-z0-9-]+[.])*github[.]com)$             $ghub:443;
        default                       "";
    }

    # Куда отправить поток ВНУТРИ nginx. Разделение нужно из-за proxy_protocol:
    # включить его можно только на весь server-блок, а сквозные проходы
    # (whatsapp, ticketmaster, github) заголовка не ждут и от него сломались бы.
    #
    # Поэтому главный блок шлёт заголовок ВСЕМ, но не наружу, а на два своих
    # слушателя: наш релей его принимает (caddy настроен), а для сквозных стоит
    # промежуточный блок ниже, который заголовок читает и дальше НЕ передаёт.
    #
    # Зачем всё это: без заголовка релей видит соединение от самого nginx и
    # штампует всем 127.0.0.1 — полторы тысячи разных людей неотличимы,
    # и поймать того, кто раздаёт наш туннель дальше, нечем.
    map $z2k_upstream $z2k_route {
        ""                 "";
        "127.0.0.1:8443"   127.0.0.1:8443;   # наш релей — принимает заголовок
        default            127.0.0.1:8446;   # сквозные — через блок-снималку
    }

    # Rate limit per source IP (anti-abuse)
    limit_conn_zone $binary_remote_addr zone=z2k_perip:10m;

    # Промежуточный блок для сквозных проходов: читает proxy_protocol от
    # главного блока и forwards дальше уже без него. SNI перечитывается заново,
    # поэтому $z2k_upstream здесь снова даёт настоящий backend.
    server {
        listen      127.0.0.1:8446 proxy_protocol;

        ssl_preread on;
        proxy_pass  $z2k_upstream;

        proxy_connect_timeout 10s;
        proxy_timeout         600s;
        proxy_buffer_size     16k;
    }

    server {
        listen      443 reuseport;
        listen      [::]:443 reuseport;

        ssl_preread on;
        proxy_protocol on;
        proxy_pass  $z2k_route;

        # AI streaming-чаты — длинные long-poll
        proxy_connect_timeout 10s;
        proxy_timeout         600s;
        proxy_buffer_size     16k;

        limit_conn z2k_perip 50;
    }
}
